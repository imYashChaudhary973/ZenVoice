name: Semgrep CE

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Swift security scan
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # semgrep/semgrep:1.164.0, pinned to its Linux/amd64 OCI manifest.
      image: semgrep/semgrep@sha256:5ac65e5366465438a5408699584c605b77f125908adaa5620d8c3e56cfa36e5b

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scan tracked source
        run: semgrep scan --config auto --error .
