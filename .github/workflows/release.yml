name: Release

# Creates a signed, notarized ZenVoice DMG release and publishes it to GitHub
# Releases. This workflow is triggered manually after the release checklist in
# docs/RELEASE_READINESS.md is complete.
#
# Required repository secrets (add these in GitHub Settings > Secrets and
# Variables > Actions before running):
#   ZENVOICE_SIGNING_IDENTITY       - full "Developer ID Application: ..." string
#   ZENVOICE_SIGNING_CERTIFICATE    - base64-encoded Developer ID .p12
#   ZENVOICE_SIGNING_CERTIFICATE_PASSWORD - password for the .p12
#   ZENVOICE_NOTARY_KEY             - base64-encoded App Store Connect API .p8
#   ZENVOICE_NOTARY_KEY_ID          - App Store Connect API key ID
#   ZENVOICE_NOTARY_ISSUER_ID       - App Store Connect API issuer ID
#
# Optional:
#   ZENVOICE_HOMEBREW_TAP_TOKEN     - GitHub token with repo scope for the tap repo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache SwiftPM dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.ZENVOICE_SIGNING_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.ZENVOICE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "Error: ZENVOICE_SIGNING_CERTIFICATE and ZENVOICE_SIGNING_CERTIFICATE_PASSWORD are required." >&2
            exit 1
          fi
          cert_path=$(mktemp)
          printf '%s' "$P12_BASE64" | base64 -d -o "$cert_path"
          keychain="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "" "$keychain" || true
          security unlock-keychain -p "" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain"
          security list-keychains -s "$keychain" $(security list-keychains | tr -d '"')
          rm -f "$cert_path"

      - name: Configure release identity
        run: |
          echo "ZENVOICE_SIGNING_IDENTITY=${{ secrets.ZENVOICE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Build and sign app
        run: ./Scripts/build-app.sh

      - name: Verify signatures before notarization
        run: codesign --verify --deep --strict --verbose=2 build/ZenVoice.app

      - name: Store notarytool credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.ZENVOICE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.ZENVOICE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ZENVOICE_NOTARY_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -d -o "$key_path"
          xcrun notarytool store-credentials zenvoice-notary \
            --key "$key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$HOME/Library/Keychains/build.keychain-db"

      - name: Notarize and staple app
        run: |
          ZENVOICE_NOTARY_PROFILE=zenvoice-notary \
            ZENVOICE_NOTARY_KEYCHAIN="$HOME/Library/Keychains/build.keychain-db" \
            ./Scripts/notarize-app.sh

      - name: Build DMG
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          rm -rf build/dmg-staging build/ZenVoice.dmg
          mkdir -p build/dmg-staging
          cp -R build/ZenVoice.app build/dmg-staging/ZenVoice.app
          ln -s /Applications build/dmg-staging/Applications
          hdiutil create \
            -volname "ZenVoice $VERSION" \
            -srcfolder build/dmg-staging \
            -ov \
            -format UDZO \
            build/ZenVoice.dmg

      - name: Notarize and staple DMG
        run: |
          xcrun notarytool submit build/ZenVoice.dmg \
            --keychain-profile zenvoice-notary \
            --keychain "$HOME/Library/Keychains/build.keychain-db" \
            --wait
          xcrun stapler staple build/ZenVoice.dmg
          xcrun stapler validate build/ZenVoice.dmg

      - name: Verify DMG contents
        run: |
          mount_point=$(mktemp -d)
          hdiutil attach build/ZenVoice.dmg -mountpoint "$mount_point" -noverify -quiet
          spctl --assess --type execute "$mount_point/ZenVoice.app"
          hdiutil detach "$mount_point" -quiet
          rm -rf "$mount_point"

      - name: Generate release notes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ./Scripts/generate-release-notes.sh "$VERSION" > build/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe14e0d0d351b72f4a6a93d6f7980c3bf4b1c # v2.2.0
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ZenVoice ${{ github.event.inputs.version }}
          body_path: build/RELEASE_NOTES.md
          make_latest: true
          files: |
            build/ZenVoice.dmg
          fail_on_unmatched_files: true

      - name: Prepare Homebrew cask update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.ZENVOICE_HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            ./Scripts/generate-homebrew-cask.rb \
              --version "$VERSION" \
              --dmg build/ZenVoice.dmg
          else
            echo "No HOMEBREW_TAP_TOKEN set; skipping Homebrew cask PR."
          fi
