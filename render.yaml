services:
  - type: web
    name: zenvoice-meeting-oauth
    runtime: node
    plan: free
    rootDir: Services/meeting-oauth
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_ORIGIN
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
